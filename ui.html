<!DOCTYPE html>

<head>
    <meta charset="UTF-8">

    <style>
        :root {
            --primary-color: #0088cc;
            --bg-color: #ffffff;
            --text-main: #222222;
            --text-muted: #919191;
            --border-color: #e9e9e9;
            --hover-bg: #f5f8fa;
            --header-shadow: 0 2px 4px -1px rgba(0,0,0,0.06);
            --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font-family);
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.5;
        }

        a {
            text-decoration: none;
            color: var(--text-main);
        }
        .site-header {
            position: sticky;
            top: 0;
            background: #fff;
            box-shadow: var(--header-shadow);
            z-index: 100;
            height: 60px;
        }

        .header-inner {
            max-width: 1110px;
            margin: 0 auto;
            padding: 0 15px;
            height: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            color: var(--text-main);
        }

        .header-icons {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .icon {
            color: var(--text-muted);
            cursor: pointer;
        }

        .user-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background-color: #ddd;
        }
        .container {
            max-width: 1110px;
            margin: 0 auto;
            padding: 20px 15px;
        }
        .nav-filters {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
        }
        .nav-filters a {
            color: var(--text-muted);
            font-size: 15px;
        }
        .nav-filters a.active {
            color: var(--text-main);
            font-weight: bold;
        }
        .main-layout {
            display: grid;
            grid-template-columns: 1fr 280px;
            gap: 40px;
        }
        .topic-list {
            width: 100%;
        }
        .topic-list-header {
            display: grid;
            grid-template-columns: 1fr 120px 60px 60px 80px;
            padding: 10px 5px;
            border-bottom: 3px solid var(--border-color);
            color: var(--text-muted);
            font-size: 13px;
        }
        .topic-item {
            display: grid;
            grid-template-columns: 1fr 120px 60px 60px 80px;
            padding: 15px 5px;
            border-bottom: 1px solid var(--border-color);
            align-items: center;
            transition: background-color 0.2s;
        }
        .topic-item:hover {
            background-color: var(--hover-bg);
        }
        .topic-main .title {
            font-size: 16px;
            font-weight: 500;
            margin-bottom: 4px;
            display: inline-block;
        }
        .topic-main .title:visited {
            color: var(--text-muted);
        }
        .category-badge {
            display: inline-flex;
            align-items: center;
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 5px;
        }
        .badge-color {
            width: 8px;
            height: 8px;
            display: inline-block;
            margin-right: 5px;
        }
        .posters {
            display: flex;
            align-items: center;
        }
        .posters img {
            width: 25px;
            height: 25px;
            border-radius: 50%;
            margin-right: 4px;
            border: 2px solid #fff;
        }
        .stats {
            color: var(--text-muted);
            font-size: 14px;
        }

        .activity {
            color: var(--text-muted);
            font-size: 14px;
            text-align: right;
        }
        .sidebar {
            background: #fafafa;
            padding: 20px;
            border-radius: 4px;
        }
        .sidebar-title {
            font-size: 14px;
            color: var(--text-muted);
            margin-bottom: 15px;
            text-transform: uppercase;
        }
        .category-list {
            list-style: none;
        }
        .category-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
            border-bottom: 1px solid var(--border-color);
            font-size: 14px;
        }
        .category-item:last-child {
            border-bottom: none;
        }
        @media (max-width: 768px) {
            .main-layout {
                grid-template-columns: 1fr;
            }
            .topic-list-header {
                display: none;
            }
            .topic-item {
                grid-template-columns: 1fr;
                gap: 10px;
            }
            .posters, .stats {
                display: none;
            }
            .activity {
                text-align: left;
                font-size: 12px;
            }
            .sidebar {
                display: none;
            }
        }
#detail-view {
    max-width: 860px;
    margin: 0 auto;
}
.back-link {
    display: inline-block;
    margin-bottom: 18px;
    color: var(--primary-color);
    font-size: 14px;
}
.thread-main {
    background: #fff;
    border: 1px solid var(--border-color);
    border-radius: 6px;
    padding: 26px;
    margin-bottom: 20px;
}
.thread-title {
    font-size: 22px;
    font-weight: 600;
    margin-bottom: 12px;
}
.thread-meta {
    font-size: 13px;
    color: var(--text-muted);
    margin-bottom: 18px;
}
.thread-body {
    font-size: 16px;
    line-height: 1.7;
}
.comment-avatar img {
    width: 36px;
    height: 36px;
    border-radius: 50%;
}
.comment-content {
    flex: 1;
}

.comment-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 6px;
}
.comment-user {
    font-weight: 600;
    font-size: 14px;
}

.comment-meta {
    font-size: 12px;
    color: var(--text-muted);
}

.comment-id {
    color: var(--text-muted);
    margin-right: 6px;
}

.comment-body {
    font-size: 15px;
    line-height: 1.65;
    white-space: pre-wrap;
	text-align:left;
}

.reply-box {
    margin-top: 20px;
    border: 1px solid var(--border-color);
    border-radius: 6px;
    padding: 16px;
    background: #fff;
}
.reply-box textarea {
    width: 100%;
    min-height: 110px;
    border: 1px solid var(--border-color);
    border-radius: 4px;
    padding: 10px;
    font-family: inherit;
    resize: vertical;
}

.reply-actions {
    margin-top: 10px;
    text-align: right;
}

.reply-actions button {
    background: var(--primary-color);
    border: none;
    color: white;
    padding: 8px 18px;
    border-radius: 4px;
    cursor: pointer;
}

.reply-actions button:hover {
    opacity: 0.9;
}
.login-btn{
    background:var(--primary-color);
    border:none;
    color:white;
    padding:6px 14px;
    border-radius:4px;
    cursor:pointer;
    font-size:14px;
}

.login-btn:hover{
    opacity:0.9;
}
.topic-toolbar{
    display:flex;
    justify-content:flex-end;
    margin-bottom:10px;
}

.new-topic-btn{
    background:var(--primary-color);
    color:#fff;
    border:none;
    padding:8px 16px;
    border-radius:4px;
    cursor:pointer;
    font-size:14px;
}

.new-topic-btn:hover{
    opacity:0.9;
}
.github-link{
    display:flex;
    align-items:center;
    color:var(--text-muted);
}

.github-link:hover{
    color:var(--primary-color);
}
.search-link{
    display:flex;
    align-items:center;
    color:var(--text-muted);
}

.search-link:hover{
    color:var(--primary-color);
}

<script>
const TAG_MAP = {
    0: {name:"保留", color:"#999999"},
    1: {name:"运营反馈", color:"#BF1E2E"},
    2: {name:"计算机网络", color:"#0E76BD"},
    3: {name:"软件开发", color:"#3AB54A"},
    4: {name:"富(多)媒体", color:"#8E44AD"},
    5: {name:"安全/密码学", color:"#C0392B"},
    6: {name:"数据/AI", color:"#16A085"},
    7: {name:"项目/开源", color:"#27AE60"},
    8: {name:"数码/电脑", color:"#2C3E50"},
    9: {name:"游戏/水", color:"#F7941D"},
    10: {name:"行业资讯", color:"#7F8C8D"}
};

const app = {

apiBase: "",
currentTag: "all",
currentPage: 1,
currentHex: null,
pageSize: 16,
token:null,
isLogin:false,

async init(){

    const path = location.pathname;

    const match = path.match(/^\/t\/topic\/([a-zA-Z0-9]+)/);

    if(match){

        const hex = match[1];

        this.currentHex = hex;

        document.querySelector(".container").style.display="none";
        document.getElementById("detail-view").style.display="block";

        this.loadPost(hex);

    }else{

        await this.checkLogin();
        this.loadIndex();

    }

},

showLoginAlert(){

    document.getElementById("login-alert").style.display="flex";

},

closeLoginAlert(){

    document.getElementById("login-alert").style.display="none";

},

openLogin(){

document.getElementById("login-modal").style.display="flex";

},

closeLogin(){

document.getElementById("login-modal").style.display="none";

},

async doLogin(){

const user=document.getElementById("user-input").value.trim();
const pass=document.getElementById("pass-input").value.trim();

const msg=document.getElementById("login-msg");

if(!user || !pass){

msg.innerText="请输入用户名和密码";

return;

}

const token=user+":"+pass;

msg.innerText="登录中...";

try{

const res=await fetch("/login",{

method:"POST",

headers:{
"Content-Type":"application/json"
},

credentials:"include",

body:JSON.stringify({token})

});

const data=await res.json();

if(data.status===1){

    this.token = token;
    this.isLogin = true;

    const avatar = data.img || 
    `https://api.dicebear.com/7.x/identicon/svg?seed=${encodeURIComponent(data.user)}`;

    document.getElementById("user-avatar").src = avatar;
	document.getElementById("newtopics").style.display="flex";

    this.setLoggedIn();

    this.closeLogin();

}else{

msg.innerText="登录失败";

}

}catch(e){

msg.innerText="网络错误";

}

},

setLoggedIn(){

document.getElementById("login-btn").style.display="none";

document.getElementById("user-avatar").style.display="block";

},

async checkLogin(){

    try{

        const res = await fetch("/me",{credentials:"include"});
        const data = await res.json();

        if(data.status===1){

            this.isLogin = true;

            const avatar = data.img || 
            `https://api.dicebear.com/7.x/identicon/svg?seed=${encodeURIComponent(data.user)}`;

            document.getElementById("user-avatar").src = avatar;
			document.getElementById("newtopics").style.display="flex";

            this.setLoggedIn();

        }

    }catch(e){}

},

goHome(){
    history.pushState(
        {view:"home"},
        "",
        "/index.php"
    );

    document.querySelector(".container").style.display="block";
    document.getElementById("detail-view").style.display="none";
},

goPost(hex){

    this.currentHex = hex;

    history.pushState(
        {view:"post",hex},
        "",
        `/t/topic/${hex}`
    );

    document.querySelector(".container").style.display="none";
    document.getElementById("detail-view").style.display="block";

    this.loadPost(hex);
},

newPost(){

    if(!this.isLogin){
        this.showLoginAlert();
        return;
    }

    alert("打开发帖编辑器");

},

async loadIndex(){

    const container = document.getElementById("topic-container");

    container.innerHTML="加载中...";

    const url = `${this.apiBase}/index/${this.currentTag}/${this.currentPage}`;

    const res = await fetch(url,{credentials:"include"});
    const data = await res.json();

    container.innerHTML="";

    data.forEach(item=>{

        const el = document.createElement("div");

        el.className="topic-item";

        const dateStr = new Date(item.lasttime*1000).toLocaleString();
		const tag = TAG_MAP[item.tag] || {name:"未知",color:"#999"};
		//console.log(item)
        el.innerHTML = `

<div class="topic-main">

    <a class="title">${this.escape(item.lastview)}</a>

    <div class="category-badge">
        <span class="badge-color" style="background:${tag.color}"></span>
        ${tag.name}
    </div>

</div>

<div class="posters">
    <img src="${getAvatar(item)}">
</div>

<div class="stats">${item.reply}</div>

<div class="stats">-</div>

<div class="activity">${dateStr}</div>

`;

        el.querySelector(".title").onclick=()=>{
            this.goPost(item.hex)
        };

        container.appendChild(el);

    });

},

async loadPost(hex){

    const container=document.getElementById("thread-content");

    container.innerHTML="加载中";

    const res=await fetch(`${this.apiBase}/view/${this.currentTag}/${hex}`);

    const data=await res.json();

    container.innerHTML="";

    data.forEach(item => {

    const el = document.createElement("div");

    el.innerHTML = `

        <div class="comment-header">

            <div class="comment-user">
                <span class="comment-id">#${item.id}</span>
                ${this.escape(item.user)}
            </div>

            <div class="comment-meta">
                ${this.escape(item.meta)}
            </div>

        </div>

        <div class="comment-body">
            ${resolvMarkdown(item.post)}
        </div>

    `;

    container.appendChild(el);

});

},

async submitReply(){

    if(!this.isLogin){

        this.showLoginAlert();

        return;

    }

    const payload = document.getElementById("reply-text").value;

    if(!payload) return;

    await fetch(`${this.apiBase}/view/${this.currentTag}/${this.currentHex}`,{

        method:"POST",

        credentials:"include",

        headers:{
            "Content-Type":"application/json"
        },

        body:JSON.stringify({
            post_payload:payload,
            tag:parseInt(this.currentTag),
            point_to:this.currentHex
        })

    });

    document.getElementById("reply-text").value="";

    this.loadPost(this.currentHex);

},

escape(text){
    return text
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
		.replace(/"/g,"&quot;")
        .replace(/'/g,"&#39;");
}

}

window.onload=()=>app.init()
window.onpopstate = function(e){

    if(!e.state || e.state.view==="home"){

        app.goHome();

    }else if(e.state.view==="post"){

        app.currentHex = e.state.hex;

        document.querySelector(".container").style.display="none";
        document.getElementById("detail-view").style.display="block";

        app.loadPost(e.state.hex);

    }

};
function getAvatar(item){

    if(item.img && item.img.trim() !== ""){
        return item.img;
    }

    const seed = encodeURIComponent(item.user || "user0");

    return `https://api.dicebear.com/7.x/micah/svg?seed=${seed}`;
}
